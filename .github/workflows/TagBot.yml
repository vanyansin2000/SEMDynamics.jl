name: TagBot

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:

jobs:
  tag:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    permissions:
      contents: write
      issues: read
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
